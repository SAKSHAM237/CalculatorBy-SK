name: Build iOS IPA, Mac App & Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-by-SK-Android-APK
          path: android/app/build/outputs/apk/release/*.apk

  build-apple:
    name: Build iOS IPA & Mac App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Archive & Package IPA / Mac App
        run: |
          cd ios
          xcodebuild -workspace HelloWorld.xcworkspace \
            -scheme HelloWorld \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/CalculatorBySK.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            archive

          APP_PATH=$(find build/CalculatorBySK.xcarchive/Products/Applications -name "*.app" | head -n 1)
          echo "Found app at: $APP_PATH"

          # Ad-hoc sign the .app for Apple Silicon (M1/M2/M3/M4) Mac execution
          codesign --force --deep --sign - "$APP_PATH"

          # 1. Package macOS app zip (for direct M1 Mac unzipping & running)
          cp -r "$APP_PATH" build/Calculator-by-SK.app
          cd build
          zip -r -y Calculator-by-SK-Mac.zip Calculator-by-SK.app

          # 2. Package iOS IPA (for iPhone / iPad / Sideloadly)
          mkdir -p Payload
          cp -r Calculator-by-SK.app Payload/
          zip -r -y Calculator-by-SK.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-by-SK-iOS-IPA
          path: ios/build/Calculator-by-SK.ipa

      - name: Upload Mac App Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-by-SK-Mac-App
          path: ios/build/Calculator-by-SK-Mac.zip
