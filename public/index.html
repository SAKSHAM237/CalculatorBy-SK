<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Calculator by SK</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23000000'/%3E%3Ctext x='215' y='330' text-anchor='middle' font-family='sans-serif' font-weight='900' fill='%23FF9F0A'%3E%3Ctspan font-size='315'%3EC%3C/tspan%3E%3Ctspan font-size='105' dy='48' dx='8' font-weight='800'%3ESK%3C/tspan%3E%3C/text%3E%3C/svg%3E" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body, #app-root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      #app-root {
        display: flex;
        flex-direction: column;
      }

      /* ── Hide MathLive's built-in keyboard/menu icon buttons (the "sword cross") ── */
      math-field::part(virtual-keyboard-toggle),
      math-field::part(menu-toggle),
      .ML__virtual-keyboard-toggle,
      .ML__menu-toggle,
      .ML__keyboard-toggle,
      [part="virtual-keyboard-toggle"],
      [part="menu-toggle"] {
        display: none !important;
        width: 0 !important;
        min-width: 0 !important;
        overflow: hidden !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app-root"></div>
  </body>
</html>
