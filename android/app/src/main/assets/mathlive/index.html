<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="./mathlive-static.css">
  <script src="./mathlive.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    math-field {
      width: 100%;
      font-size: 34px;
      color: #FFFFFF;
      background: transparent;
      border: none;
      outline: none;
      padding: 6px 12px;
      text-align: right;
      pointer-events: none !important;
      user-select: none !important;
      -webkit-user-select: none !important;
      touch-action: none !important;
    }
    math-field::part(virtual-keyboard-toggle),
    math-field::part(menu-toggle),
    .ML__virtual-keyboard-toggle,
    .ML__menu-toggle,
    .ML__keyboard,
    .math-field-keyboard,
    math-field-virtual-keyboard,
    .MLK__backdrop,
    .MLK__plate,
    div[data-ml-keyboard] {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
      height: 0 !important;
      width: 0 !important;
      opacity: 0 !important;
    }
    math-field:focus-within {
      outline: none;
      border: none;
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>
  <math-field id="mf" virtual-keyboard-mode="off" math-virtual-keyboard-policy="manual" menu-mode="none" read-only></math-field>
  <script>
    const mf = document.getElementById('mf');
    if (window.mathVirtualKeyboard) {
      try {
        window.mathVirtualKeyboard.policy = 'manual';
        window.mathVirtualKeyboard.hide();
      } catch (e) {}
    }

    function notifyChange() {
      if (!window.ReactNativeWebView || !mf) return;
      try {
        const asciiMath = mf.getValue('ascii-math') || '';
        const latex = mf.getValue('latex') || '';
        let mathJson = null;
        try {
          mathJson = mf.getValue('math-json');
        } catch (e) {}

        window.ReactNativeWebView.postMessage(JSON.stringify({
          type: 'EXPRESSION_CHANGE',
          asciiMath: asciiMath,
          latex: latex,
          mathJson: mathJson
        }));
      } catch (err) {
        console.error('notifyChange error', err);
      }
    }

    if (mf) {
      mf.addEventListener('input', notifyChange);
    }

    window.executeMathCommand = function(cmd, arg) {
      if (!mf) return;
      if (cmd === 'setValue') {
        mf.setValue(arg || '');
      } else if (cmd === 'deleteAll' || cmd === 'clear') {
        mf.setValue('');
      } else if (cmd === 'insert') {
        mf.setValue((mf.value || '') + (arg || ''));
      }
      notifyChange();
    };

    window.addEventListener('message', function(event) {
      try {
        const data = JSON.parse(event.data);
        if (data && data.type === 'COMMAND') {
          window.executeMathCommand(data.command, data.arg);
        }
      } catch (err) {}
    });

    document.addEventListener('DOMContentLoaded', function() {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'READY' }));
      }
    });
  </script>
</body>
</html>
